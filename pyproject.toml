[project]
name = "vigilcultor"
version = "0.1.0.dev3"
description = "Self-hosted AI caretaker for GitHub repositories: label-driven, container-isolated"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.2",
    "alembic>=1.20.0",
]

[project.scripts]
vigilcultor = "vigilcultor.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) in parameter defaults is the idiomatic FastAPI pattern
"src/vigilcultor/webapp/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
